<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300"><defs>
  <filter id="wob" filterUnits="userSpaceOnUse" x="-100" y="-100" width="700" height="700">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="9" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="soft" filterUnits="userSpaceOnUse" x="-100" y="-100" width="700" height="700">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation="1.2"/>
  </filter>
</defs><g filter="url(#wob)">
  <circle cx="140" cy="160" r="96" fill="#b97c24" opacity=".07"/>
  <circle cx="140" cy="160" r="100" fill="none" stroke="#b97c24" stroke-width="9" opacity=".22" stroke-dasharray="380 40 200 10"/>
  <circle cx="140" cy="160" r="101" fill="none" stroke="#b97c24" stroke-width="3.2" opacity=".75" stroke-dasharray="380 40 200 10"/>
</g><g filter="url(#wob)">
  <circle cx="225" cy="130" r="88" fill="#b97c24" opacity=".07"/>
  <circle cx="225" cy="130" r="92" fill="none" stroke="#b97c24" stroke-width="9" opacity=".22" stroke-dasharray="300 60 160 20"/>
  <circle cx="225" cy="130" r="93" fill="none" stroke="#b97c24" stroke-width="3.2" opacity=".75" stroke-dasharray="300 60 160 20"/>
</g></svg>