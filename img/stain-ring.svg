<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><defs>
  <filter id="wob" filterUnits="userSpaceOnUse" x="-100" y="-100" width="700" height="700">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="5" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="soft" filterUnits="userSpaceOnUse" x="-100" y="-100" width="700" height="700">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation="1.2"/>
  </filter>
</defs><g filter="url(#wob)">
  <circle cx="150" cy="150" r="106" fill="#b97c24" opacity=".07"/>
  <circle cx="150" cy="150" r="110" fill="none" stroke="#b97c24" stroke-width="9" opacity=".22" stroke-dasharray="520 30 120 25"/>
  <circle cx="150" cy="150" r="111" fill="none" stroke="#b97c24" stroke-width="3.2" opacity=".75" stroke-dasharray="520 30 120 25"/>
</g><g filter="url(#soft)"><circle cx="248" cy="226" r="9" fill="#b97c24" opacity=".6"/><circle cx="262" cy="244" r="4" fill="#b97c24" opacity=".6"/></g></svg>