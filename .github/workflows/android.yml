name: App Android (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dipendenze
        run: npm install --no-audit --no-fund

      - name: Progetto Android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node scripts/prepare-www.mjs
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Compila APK
        working-directory: android
        run: |
          mkdir -p ~/.android
          cp ../android-signing/debug.keystore ~/.android/debug.keystore
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../sorsi.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../sorsi-1.0.${{ github.run_number }}.apk

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sorsi 1.0.${{ github.run_number }}
          body: |
            APK per Android: scarica sorsi-1.0.${{ github.run_number }}.apk dal telefono e aprilo per installarlo.
            Si installa sopra la versione precedente senza perdere i vini.
          files: |
            sorsi.apk
            sorsi-1.0.${{ github.run_number }}.apk
          make_latest: true
